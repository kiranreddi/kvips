name: AHB BK2BK CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ahb/**'
      - 'common/**'
      - 'third_party/uvm/**'
      - '.github/workflows/ahb-bk2bk-verilator.yml'
      - '.github/verilator-version'
      - '.github/actions/setup-verilator/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'ahb/**'
      - 'common/**'
      - 'third_party/uvm/**'
      - '.github/workflows/ahb-bk2bk-verilator.yml'

jobs:
  ahb-bk2bk:
    name: AHB BK2BK (Verilator)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Verilator
        uses: ./.github/actions/setup-verilator

      - name: Run AHB BK2BK Regressions
        run: |
          cd ahb/examples/uvm_back2back/sim
          chmod +x run_verilator.sh regress_verilator.sh
          export VERILATOR_JOBS=$(nproc)
          ./regress_verilator.sh

      - name: Archive Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahb-bk2bk-verilator-results
          path: ahb/examples/uvm_back2back/sim/out/verilator/
