name: Verilator Lint (Portable Subset)

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.sv'
      - '**.svh'
      - '**.v'
      - '**.vh'
      - '.github/workflows/verilator-lint.yml'
      - '.github/verilator-version'
      - '.github/actions/setup-verilator/**'
      - 'scripts/lint-verilator.sh'
      - 'common/sv/lint/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**.sv'
      - '**.svh'
      - '**.v'
      - '**.vh'
      - 'scripts/lint-verilator.sh'
      - 'common/sv/lint/**'

jobs:
  verilator-lint:
    name: Verilator Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Verilator
        uses: ./.github/actions/setup-verilator

      - name: Run Verilator Lint
        run: |
          chmod +x scripts/lint-verilator.sh
          ./scripts/lint-verilator.sh
