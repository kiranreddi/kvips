# KVIPS - Premium Verification IP Suite
# GitHub Pages Configuration

title: KVIPS
description: >-
  Open-source SystemVerilog UVM verification IP for AMBA AXI4, APB, and AHB.
  Verilator example regressions run in CI; commercial simulator scripts are provided.

# GitHub Pages will set these automatically
baseurl: "/kvips" # Project pages baseurl
url: "https://kiranreddi.github.io" # Your GitHub Pages URL

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Collections
collections:
  pages:
    output: true
    permalink: /:path/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# Plugins (GitHub Pages whitelist)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-relative-links

# SEO
author: Kiran Tathekalva
lang: en_US

# Social
social:
  name: KVIPS
  links:
    - https://github.com/kiranreddi/kvips

# Exclude from build (RTL trees and tooling — keep the Pages site lean)
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .git
  - .gitignore
  - .github
  - .devcontainer
  - .pre-commit-config.yaml
  - LICENSE
  - Makefile
  - axi4
  - axi4_lite
  - apb
  - ahb
  - common
  - docs
  - scripts
  - third_party
  - KVIPS_COMPREHENSIVE_REVIEW.md
  - QUICK_REFERENCE.md
  - README.md

# Include assets
include:
  - _layouts
  - assets
